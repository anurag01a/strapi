name: Streamline CI - Build and Push Strapi

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  # Replace with your actual Docker Hub username or Repo URL
  DOCKER_REPO: ${{ secrets.DOCKER_USERNAME }}/strapi-app 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REPO }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Export the tag for use in the CD pipeline (manual trigger instructions provided in docs)
      - name: Output Image Tag
        run: echo "Image generated with tag sha-${{ github.sha }}"
