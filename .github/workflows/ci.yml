name: Streamline CI/CD - LocalStack Blue/Green

on:
  push:
    branches: [ "main", "working_anurag_2" ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  TF_WORKING_DIR: ECS_Fargate/terraform

jobs:
  deploy-localstack:
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:3.4.0
        ports:
          - 4566:4566
          - 4510-4559:4510-4559
        env:
          DEFAULT_REGION: us-east-1
          DEBUG: 1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install AWS CLI & LocalStack Wrapper
        run: |
          pip install awscli-local

      # 1. Provision Infrastructure (Simulated)
      # Note: We bypass Terraform for LocalStack to avoid Pro-feature licensing 501 errors.
      - name: Setup LocalStack Resources
        run: |
          chmod +x .github/scripts/setup_localstack.sh
          ./.github/scripts/setup_localstack.sh

      # 2. Set ECR Repo URI (Hardcoded for LocalStack)
      - name: Set ECR Repository URI
        run: |
          echo "ECR_REPO=localhost:4566/strapi-app" >> $GITHUB_ENV

      # 3. Build and Push to LocalStack ECR
      - name: Build and Push Docker Image
        run: |
          # Create a dummy tag for LocalStack ECR (localhost:4566)
          # Note: Docker inside runner talking to mapped port 4566
          IMAGE_TAG="sha-${{ github.sha }}"
          FULL_IMAGE="${{ env.ECR_REPO }}:$IMAGE_TAG"
          
          # Build
          docker build -t "$FULL_IMAGE" .
          
          # Login (LocalStack doesn't strictly enforce auth but good practice to allow the push)
          # We force the push to localhost:4566
          docker push "$FULL_IMAGE"
          
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "FULL_IMAGE=$FULL_IMAGE" >> $GITHUB_ENV

      # 4. Register New Task Definition
      - name: Register New Task Definition
        id: task-def
        run: |
          # Fetch current definition
          # We need to construct the new container definition with the new image
          
          TASK_FAMILY="strapi-task"
          
          # Get the current task definition JSON
          aws --endpoint-url=http://localhost:4566 ecs describe-task-definition --task-definition $TASK_FAMILY --query "taskDefinition" > task-def-orig.json
          
          # jq replacement to update image
          # Removing keys incompatible with 'register-task-definition' (status, taskDefinitionArn, etc)
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy) | .containerDefinitions[0].image = "${{ env.FULL_IMAGE }}"' task-def-orig.json > task-def-new.json
          
          # Register
          NEW_TASK_ARN=$(aws --endpoint-url=http://localhost:4566 ecs register-task-definition --cli-input-json file://task-def-new.json --query "taskDefinition.taskDefinitionArn" --output text)
          echo "NEW_TASK_ARN=$NEW_TASK_ARN" >> $GITHUB_ENV

      # 5. Create Deployment (CodeDeploy)
      - name: Trigger CodeDeploy Blue/Green
        id: deploy
        run: |
          echo "Simulating Blue/Green Deployment with CodeDeploy..."
          echo "NOTE: LocalStack Community Edition does not support CodeDeploy."
          echo "Skipping actual 'create-deployment' call to avoid 501 error."
          
          # Mock a success ID for the verification script
          echo "DEPLOYMENT_ID=d-MOCKED123" >> $GITHUB_ENV

      # 6. Monitor Deployment
      - name: Monitor Deployment
        run: |
          # Check if it's the mocked ID
          if [ "${{ env.DEPLOYMENT_ID }}" == "d-MOCKED123" ]; then
            echo "Mocked deployment successful. Skipping real verification."
            exit 0
          fi
          
          chmod +x .github/scripts/verify_deployment.sh
          ./.github/scripts/verify_deployment.sh "${{ env.DEPLOYMENT_ID }}" "us-east-1" "http://localhost:4566"

