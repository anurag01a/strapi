version: '3.8'

services:
  # Database Service
  postgres:
    image: postgres:15-alpine
    container_name: strapi-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-strapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strapi}
      POSTGRES_DB: ${POSTGRES_DB:-strapi}
    volumes:
      - strapi-data:/var/lib/postgresql/data
    networks:
      - strapi-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U strapi']
      interval: 10s
      timeout: 5s
      retries: 5

  # Strapi Service
  strapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strapi-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-strapi}
      DATABASE_USERNAME: ${POSTGRES_USER:-strapi}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-strapi}
      DATABASE_SSL: 'false'
      NODE_ENV: development
    volumes:
      - ./config:/workspace/config
      - ./src:/workspace/src
      - ./public/uploads:/workspace/public/uploads
    networks:
      - strapi-net
    expose:
      - '1337'

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: strapi-nginx
    restart: always
    depends_on:
      - strapi
    ports:
      - '80:80'
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - strapi-net

volumes:
  strapi-data:

networks:
  strapi-net:
    driver: bridge
